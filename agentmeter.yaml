# agentmeter.yaml
# Money values are written in USD here and converted to integer micro-USD on load.
# Prices are placeholders: check them against the providers' price pages before the demo.
upstream: https://api.openai.com/v1
default_max_tokens: 1024
pricing:            # USD per 1M tokens
  gpt-4o-mini: {input: 0.15, output: 0.60}
  gemini-2.5-flash: {input: 0.30, output: 2.50}
budgets:
  default_run_usd: 0.50
  agents:
    support-bot: {daily_usd: 20}
  teams:
    platform: {monthly_usd: 500}
loop:
  repeat_threshold: 3        # same request fingerprint N times in a run -> breaker opens (loop)
  step_cap: 50               # call 51 of a run -> breaker opens (step_cap)
  consecutive_tool_calls: 3  # same tool call in K responses in a row -> opens (loop)
  agents: {}                 # per-agent overrides, e.g. status-poller: {repeat_threshold: 20}
# admin_token: set AGENTMETER_ADMIN_TOKEN to enable POST /admin/runs/{id}/reset
alerts:
  thresholds: [0.5, 0.75, 0.9]   # of each budget level's limit, measured on spent
  webhook_url: ${ALERT_WEBHOOK}  # Slack-compatible; unset: the worker only logs alerts
  retry_idle_seconds: 30         # a failed post is retried after being pending this long
events:
  stream_maxlen: 100000          # am:events, XADD MAXLEN ~
