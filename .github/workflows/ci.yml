name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AGENTMETER_TEST_REDIS_URL: redis://localhost:6379/15
      AGENTMETER_REQUIRE_REDIS: "1"
      AGENTMETER_REQUIRE_DEMO: "1"  # tests/test_demo.py fails instead of skipping
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/cache@v4
        with:
          path: .tiktoken-cache
          key: tiktoken-o200k-cl100k-v1
      # The demo extra makes tests/test_demo.py run here (it never calls a real API).
      - run: pip install -c requirements.lock -e ".[dev,demo]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests
        run: |
          pytest -q -rs -m "not concurrency" | tee pytest.out
          # Surface the summary line (passed / skipped counts) as a run annotation.
          echo "::notice title=pytest summary::$(tail -n 1 pytest.out)"
      - name: Concurrency (2 replicas)
        run: |
          pytest -v -rs -m concurrency | tee pytest-concurrency.out
          echo "::notice title=pytest concurrency summary::$(tail -n 1 pytest-concurrency.out)"
